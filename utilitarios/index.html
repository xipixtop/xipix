<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIPIX.TOP - Downloads</title>
    <style>
        body {
            background-color: #121620;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1a1f2c;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: #3b82f6; margin-bottom: 20px; }
        .file-list { list-style: none; padding: 0; margin: 20px 0; }
        .file-item {
            background-color: #242b3d;
            margin: 10px 0;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-download {
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-download:hover { background-color: #1d4ed8; }
        .btn-voltar { color: #a0aec0; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📁 Arquivos Disponíveis</h2>
    <p>Clique no botão para baixar o utilitário:</p>
    
    <ul class="file-list">
        <!-- Item de Arquivo -->
        <li class="file-item">
            <span>XIPIX_EXTREMTOOLS.hta</span>
            <a href="XIPIX_EXTREMTOOLS.hta" download class="btn-download">Baixar</a>
        </li>
        <!-- Se tiver mais arquivos na pasta, basta copiar a linha acima e mudar o nome do arquivo -->
    </ul>
    
    <br>
    <a href="../index.html" class="btn-voltar">← Voltar ao Painel</a>
</div>

</body>
</html>
